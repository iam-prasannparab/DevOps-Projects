   - name: Build and push Docker image
     hosts: ansible
     tasks:
       - name: Build image
         community.docker.docker_image_build:
           name: <dockerhub-user>/tomcat-hello
           tag: latest
           path: /opt/docker

       - name: Push image to Docker Hub
         community.docker.docker_image_push:
           name: <dockerhub-user>/tomcat-hello
           tag: latest